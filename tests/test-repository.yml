name: Test repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: 'false'
          repository: 'https://mirror.ctan.org/systems/texlive/tlnet'
          packages: 'latex'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be set"
            exit 1
          fi
          echo "PASS: version is '$VERSION'"
      - name: Assert latex is available
        run: |
          if ! command -v latex > /dev/null 2>&1; then
            echo "FAIL: latex command not found"
            exit 1
          fi
          echo "PASS: latex is available"
