name: Test texdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          cache: 'false'
          texdir: '/tmp/custom-texlive'
          packages: 'latex'
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert texdir was used
        run: |
          if [ ! -d "/tmp/custom-texlive" ]; then
            echo "FAIL: expected /tmp/custom-texlive directory to exist"
            exit 1
          fi
          echo "PASS: custom texdir exists"
