name: Test texdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache: 'false'
          texdir: '${{ runner.temp }}/my-texlive-dir'
          packages: 'scheme-infraonly'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert texdir was used
        run: |
          if [ ! -d "$RUNNER_TEMP/my-texlive-dir" ]; then
            echo "FAIL: expected texdir '$RUNNER_TEMP/my-texlive-dir' to exist"
            exit 1
          fi
          echo "PASS: texdir exists at $RUNNER_TEMP/my-texlive-dir"
