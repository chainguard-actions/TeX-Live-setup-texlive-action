name: Test texdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          cache: 'false'
          texdir: /tmp/my-texdir
          packages: ''
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert TeX Live installed under custom texdir
        run: |
          if [ ! -d "/tmp/my-texdir" ]; then
            echo "FAIL: expected texdir /tmp/my-texdir to exist"
            exit 1
          fi
          echo "PASS: texdir exists"
