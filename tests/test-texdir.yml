name: Test TeX Live setup with custom texdir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: '2023'
          cache: 'false'
          packages: 'scheme-infraonly'
          texdir: '/tmp/texlive-custom-texdir'
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert TeX Live installed under custom texdir
        run: |
          echo "Checking for TeX Live under /tmp/texlive-custom-texdir"
          if [ ! -d "/tmp/texlive-custom-texdir" ]; then
            echo "FAIL: expected texdir /tmp/texlive-custom-texdir to exist"
            exit 1
          fi
          echo "PASS: texdir directory exists"
      - name: Assert tlmgr is available
        run: |
          if ! command -v tlmgr &>/dev/null; then
            echo "FAIL: tlmgr not found in PATH"
            exit 1
          fi
          echo "PASS: tlmgr found at $(command -v tlmgr)"
